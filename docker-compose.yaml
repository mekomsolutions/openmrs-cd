version: '3'

services:
  openmrscd:
    image: mekomsolutions/openmrscd:latest
    container_name: "openmrscd"
    ports:
      - "8080:8080"
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_AUTH_METHOD=${VAULT_AUTH_METHOD:-approle}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID:-}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID:-}
      - VAULT_APPROLE_PATH=${VAULT_APPROLE_PATH:-approle}
      - VAULT_K8S_ROLE=${VAULT_K8S_ROLE:-}
      - VAULT_K8S_MOUNT=${VAULT_K8S_MOUNT:-kubernetes}
      - VAULT_KV_VERSION=${VAULT_KV_VERSION:-2}
      - VAULT_NAMESPACE=${VAULT_NAMESPACE:-}
      - VAULT_SKIP_VERIFY=${VAULT_SKIP_VERIFY:-false}
    volumes:
     - ./node-scripts:/opt/node-scripts
     - ./jenkins/jenkins_home:/var/jenkins_home
     - ~/.m2:/var/jenkins_home/.m2
     - ./data/app_data:/var/lib/openmrs_cd/app_data
     - ~/.ssh:/var/jenkins_home/.ssh

  # Dev-mode Vault: in-memory, auto-unsealed, root token. Local testing only.
  # Started with: docker compose --profile vault up
  vault:
    image: hashicorp/vault:1.17
    container_name: "vault"
    profiles: ["vault"]
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID:-root}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
